server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: assetflow
  datasource:
    url: jdbc:postgresql://localhost:5432/assetflow
    username: assetflow
    password: assetflow123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: AssetFlowSuperSecretKeyForJWTTokenGeneration2024ChangeInProduction!
    expiration-ms: 86400000
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.assetflow: DEBUG
    org.springframework.security: INFO